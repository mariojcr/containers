# GE-Proton sobre Debian para servidores dedicados de Steam. La versión vive
# en el ARG del Dockerfile (ahí la actualiza Renovate, que no puede escribir
# en ficheros de .github/workflows/ con el token de Actions) y de ahí sale
# también el tag de la imagen.
#
# Publica dos tags: la versión (:11-7), que se reescribe en cada build, y
# :11-7-<sha corto>, que no se mueve nunca — es la que conviene fijar en un
# job para saber exactamente qué está corriendo.
name: Proton CI
on:
  workflow_dispatch:
  push:
    paths:
      - "proton/**"
      - ".github/workflows/proton.yml"
  pull_request:
    paths:
      - "proton/**"
      - ".github/workflows/proton.yml"
env:
  APP: proton
  REGISTRY: ghcr.io/mariojcr
jobs:
  build:
    name: Build Proton
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Version and sha
        id: meta
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ARG PROTON_VERSION=//p' proton/Dockerfile)
          [ -n "$version" ] || { echo "::error::no PROTON_VERSION in proton/Dockerfile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ env.APP }}/
          # en una PR solo se comprueba que construye
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            PROTON_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.APP }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
        env:
          DOCKER_BUILD_SUMMARY: false
      - name: Scan for vulnerabilities
        id: scan
        if: github.event_name != 'pull_request'
        uses: crazy-max/ghaction-container-scan@v4
        with:
          image: ${{ env.REGISTRY }}/${{ env.APP }}:${{ steps.meta.outputs.version }}
          annotations: true
          dockerfile: ./${{ env.APP }}/Dockerfile
      - name: Clean up untagged images
        if: github.event_name != 'pull_request'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.APP }}
          package-type: container
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}
