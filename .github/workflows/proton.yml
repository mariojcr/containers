#
# GE-Proton on Debian for Steam dedicated servers. The version lives in the
# Dockerfile's ARG — Renovate updates it there, since with the Actions token
# it cannot write under .github/workflows/ — and the image tag comes from it.
#
# Two tags go out: the version (:11-11), rewritten on every build, and
# :11-11-<short sha>, which never moves. Pin that one in a job to know exactly
# what is running.
name: Proton CI
on:
  workflow_dispatch:
  push:
    paths:
      - "proton/**"
      - ".github/workflows/proton.yml"
  pull_request:
    paths:
      - "proton/**"
      - ".github/workflows/proton.yml"
env:
  APP: proton
  REGISTRY: ghcr.io/mariojcr
jobs:
  build:
    name: Build Proton
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Version and sha
        id: meta
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ARG PROTON_VERSION=//p' proton/Dockerfile)
          [ -n "$version" ] || { echo "::error::no PROTON_VERSION in proton/Dockerfile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ env.APP }}/
          # on a pull request we only check that it builds
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            PROTON_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.APP }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
        env:
          DOCKER_BUILD_SUMMARY: false
      - name: Scan for vulnerabilities
        id: scan
        if: github.event_name != 'pull_request'
        uses: crazy-max/ghaction-container-scan@v3
        with:
          image: ${{ env.REGISTRY }}/${{ env.APP }}:${{ steps.meta.outputs.version }}
          annotations: true
          dockerfile: ./${{ env.APP }}/Dockerfile
      - name: Clean up untagged images
        if: github.event_name != 'pull_request'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.APP }}
          package-type: container
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}
