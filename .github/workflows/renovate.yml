#
# Renovate runs the custom managers: the versions that live inside a file
# (DepotDownloader, GE-Proton), which Dependabot cannot read. Everything it
# proposes is configured in renovate.json5; this is only the runner.
#
# With the default GITHUB_TOKEN, the PRs Renovate opens do NOT trigger other
# workflows (GitHub's loop protection), so the build does not validate the
# bump before it merges. A user or app token in the RENOVATE_TOKEN secret
# (contents and pull-requests write on this repository) fixes that.
name: renovate

on:
  schedule:
    # Mondays at 05:17 UTC, before anyone starts poking at things
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - renovate.json5
      - .github/workflows/renovate.yml
      - scripts/*.sh

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          # post-upgrade tasks are blocked unless listed here
          RENOVATE_ALLOWED_COMMANDS: '["^\\./scripts/pin-(depotdownloader|proton)\\.sh "]'
          LOG_LEVEL: info
