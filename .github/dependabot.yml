#
# Dependabot takes what it can read on its own: the Dockerfiles' base images
# and the workflows' actions. Being native it needs no credentials, and it may
# write under .github/workflows/, which the Actions token may not.
#
# What lives inside an ARG (GE-Proton, DepotDownloader) is invisible to it;
# Renovate handles those with custom managers (renovate.json5).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories:
      - "/proton"
      - "/net-nomad"
    schedule:
      interval: weekly
      day: monday
